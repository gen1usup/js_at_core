stages:
  - validate
  - e2e

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

core:
  image: node:22
  stage: validate
  script:
    - npm ci
    - npm run ci:core
  artifacts:
    when: always
    paths:
      - artifacts/
      - coverage/
      - packages/*/dist/
      - projects/*/dist/
    expire_in: 7 days

e2e:
  image: node:22
  stage: e2e
  script:
    - npm ci
    - npx playwright install --with-deps chromium
    - npm run ci:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
      - artifacts/
    expire_in: 7 days
