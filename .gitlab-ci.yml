stages:
  - validate

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

validate:
  image: node:22
  stage: validate
  script:
    - npm ci
    - npm run lint
    - npm run typecheck
    - npm run test
    - npm run build
    - npm run validate
  artifacts:
    when: always
    paths:
      - artifacts/
      - coverage/
      - packages/*/dist/
      - projects/*/dist/
