stages:
  - validate
  - test

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

validate:
  image: node:22
  stage: validate
  script:
    - npm ci
    - npm run lint
    - npm run typecheck
    - npm run test
    - npm run build
    - npm run validate
  artifacts:
    when: always
    paths:
      - artifacts/
      - coverage/
      - packages/*/dist/
      - projects/*/dist/

e2e:
  image: node:22
  stage: test
  script:
    - npm ci
    - npx playwright install --with-deps chromium
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days
