name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  core:
    name: Core validation and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build
        run: npm run ci:core

      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-artifacts
          if-no-files-found: ignore
          path: |
            artifacts/
            coverage/
            packages/*/dist/
            projects/*/dist/

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: npm run ci:e2e

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            artifacts/
