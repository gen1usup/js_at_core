name: CI

on:
  push:
    branches: ['main', 'master']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and showcase tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Validate config and governance
        run: npm run validate

      - name: Playwright e2e
        run: npm run test:e2e

      - name: Upload automation artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-artifacts
          path: |
            artifacts/
            coverage/
            playwright-report/
            test-results/
            **/dist/
